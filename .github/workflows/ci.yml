# What this file is for: `README.md`, `docs/guide/rules.md`, `docs/internals/testing.md` and
# `docs/decisions.md` all say the model/checker independence is "enforced in CI". Until this
# workflow existed, that was a claim about a linter nobody ran on a schedule. Two of the jobs
# below are the two halves of it -- the suite, and the import contracts that carry the
# independence rule. The third holds the documentation to the charter in `CLAUDE.md`.
#
# The mutation harness is deliberately not here. It rewrites source files and takes tens of
# minutes, and `CLAUDE.md` says to run it when a test layer is added or is about to be
# trusted, which is a judgement rather than a trigger.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # The version `docs/benchmarks.md` records for the committed numbers.
  UV_PYTHON: "3.12"

jobs:
  suite:
    name: tests (${{ matrix.label }})
    # Back on linux x86-64, which is a claim rather than a preference (`D-121`). `D-118`
    # moved CI to macOS because the committed artifacts carried the ortools build that made
    # them; `D-119` made the roster a function of the model instead of the search, so they
    # should not any more. This runner is the experiment: a different binary from the one
    # every artifact here was recorded on. If the six scenario tests and the manifest agree,
    # the canonical optimum travels; if they do not, it does not.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both halves of the optional-extra contract. Without `nl`, every deterministic
          # layer must still pass -- that is the import contract restated as a test run.
          # With it, the parse's schema tests actually execute rather than skipping, which
          # is the layer that caught `D-101`. Neither job has an API key, because nothing
          # in the suite calls a model.
          - label: no extras
            extras: ""
          - label: nl extra
            extras: "--extra nl"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # `--frozen` so a lockfile that has drifted from `pyproject.toml` fails here rather
      # than resolving to something nobody committed.
      - run: uv sync --frozen ${{ matrix.extras }}
      # `-m "not machine"` drops the tests that assert an artifact against the machine that
      # recorded it: the timing guards, because a runner is slower at Python and at CP-SAT
      # by different factors (`D-114`), and the solved half of the benchmark manifest,
      # because the optimum is degenerate and which roster comes back is a property of the
      # ortools build (`D-117`). The generated half of the manifest is still checked here.
      - run: uv run pytest -q -m "not machine"

  contracts:
    name: import contracts
    # Back on linux x86-64, which is a claim rather than a preference (`D-121`). `D-118`
    # moved CI to macOS because the committed artifacts carried the ortools build that made
    # them; `D-119` made the roster a function of the model instead of the search, so they
    # should not any more. This runner is the experiment: a different binary from the one
    # every artifact here was recorded on. If the six scenario tests and the manifest agree,
    # the canonical optimum travels; if they do not, it does not.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run lint-imports

  docs:
    name: doc lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The coined-word check reads the system word list and **skips silently** when there is
      # none, so without this the job would pass while that check did nothing. `wamerican` is
      # what provides /usr/share/dict/words on this image; the guard after it is what turns a
      # silently-inert check into a red build.
      - run: sudo apt-get update && sudo apt-get install -y wamerican
      - run: test -s /usr/share/dict/words
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # The script is stdlib-only and needs none of this, but the command CI runs is then the
      # command `CLAUDE.md` tells a person to run, which is the point.
      - run: uv sync --frozen
      - run: uv run python scripts/lint_docs.py
