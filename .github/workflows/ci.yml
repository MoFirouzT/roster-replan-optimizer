# What this file is for: `README.md`, `docs/guide/rules.md`, `docs/internals/testing.md` and
# `docs/decisions.md` all say the model/checker independence is "enforced in CI". Until this
# workflow existed, that was a claim about a linter nobody ran on a schedule. That claim has
# two halves: the suite, and the import contracts that carry the independence rule. The
# contracts job below is one of them, and the doc lint holds the documentation to the charter
# in `CLAUDE.md`.
#
# The other half, the suite, is in `tests.yml`. A GitHub badge is workflow-scoped, so while
# the suite sat here no badge could say "the tests pass" without also going red for a stale
# `*Assumes:*` line. The split is what makes `README.md`'s tests badge mean the tests.
#
# The mutation harness is deliberately in neither. It rewrites source files and takes tens of
# minutes, and `CLAUDE.md` says to run it when a test layer is added or is about to be
# trusted, which is a judgement rather than a trigger.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # The version `docs/benchmarks.md` records for the committed numbers.
  UV_PYTHON: "3.12"

jobs:
  contracts:
    name: import contracts
    # Back on linux x86-64, which is a claim rather than a preference (`D-121`). `D-118`
    # moved CI to macOS because the committed artifacts carried the ortools build that made
    # them; `D-119` made the roster a function of the model instead of the search, so they
    # should not any more. This runner is the experiment: a different binary from the one
    # every artifact here was recorded on. If the six scenario tests and the manifest agree,
    # the canonical optimum travels; if they do not, it does not.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run lint-imports

  docs:
    name: doc lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The coined-word check reads the system word list and **skips silently** when there is
      # none, so without this the job would pass while that check did nothing. `wamerican` is
      # what provides /usr/share/dict/words on this image; the guard after it is what turns a
      # silently-inert check into a red build.
      - run: sudo apt-get update && sudo apt-get install -y wamerican
      - run: test -s /usr/share/dict/words
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # The script is stdlib-only and needs none of this, but the command CI runs is then the
      # command `CLAUDE.md` tells a person to run, which is the point.
      - run: uv sync --frozen
      - run: uv run python scripts/lint_docs.py
