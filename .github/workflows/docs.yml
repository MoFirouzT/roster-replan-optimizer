# The documentation site (`mkdocs.yml`).
#
# Two jobs, deliberately split. `build` runs on every push and pull request and only
# proves the site still assembles: a renamed file, a broken nav entry or a link the hook
# cannot resolve fails there rather than silently. `deploy` publishes, and runs on pushes
# to `main` and by hand. A pull request never deploys, so a branch cannot put anything on
# the live site before it merges.
#
# The repository's Pages source must be set to GitHub Actions rather than "deploy from a
# branch". With the branch setting these runs go green and change nothing. Nothing built
# here is committed: `build/` is gitignored and the artifact goes straight to Pages.

name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One deploy at a time, and never cancel one midway: an interrupted Pages deployment
# leaves the site serving a half-published state.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The version `docs/benchmarks.md` records for the committed numbers, as in `ci.yml`.
  UV_PYTHON: "3.12"

jobs:
  build:
    name: build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --group docs

      # `--strict` because the hook leaves nothing unresolved: see the note in mkdocs.yml.
      - name: Build
        run: uv run --group docs mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    name: publish to Pages
    # Every push to `main`, plus a manual run. Never on a pull request.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
