[project]
name = "roster-replan-optimizer"
version = "0.0.0"
description = "Minimum-disruption shift-roster replanning under labour constraints."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "ortools>=9.14",
    "uvicorn>=0.52.3",
]

[dependency-groups]
dev = [
    "anyio>=4.14.2",
    "httpx>=0.28.1",
    "import-linter>=2.13",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

# The independence rule from docs/specs/rules.md, mechanised. The module boundary is
# enforceable; the no-shared-thresholds half is a review obligation no linter can
# discharge, since none can tell a shared constant from a coincidentally equal one.
[tool.importlinter]
root_packages = ["roster_replan", "benchmarks"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The checker is an independent reading: it never reaches the model or a solver"
type = "forbidden"
source_modules = ["roster_replan.checker"]
forbidden_modules = ["roster_replan.model", "ortools"]

[[tool.importlinter.contracts]]
name = "The model never reaches the checker"
type = "forbidden"
source_modules = ["roster_replan.model"]
forbidden_modules = ["roster_replan.checker"]

[[tool.importlinter.contracts]]
name = "Input validation is independent of both readings"
type = "forbidden"
source_modules = ["roster_replan.validation"]
forbidden_modules = [
    "roster_replan.checker",
    "roster_replan.model",
    "roster_replan.disruption",
    "ortools",
]

# The same independence, applied to the objective. Brute-force stage (b) compares the
# optimum `disruption` encodes against the minimum `scoring` measures, so a shared helper
# would turn that comparison into an identity.
[[tool.importlinter.contracts]]
name = "The objective scorer is an independent reading: no solver, no model encoding"
type = "forbidden"
source_modules = ["roster_replan.scoring"]
forbidden_modules = [
    "roster_replan.disruption",
    "roster_replan.model",
    "roster_replan.checker",
    "ortools",
]

[[tool.importlinter.contracts]]
name = "The objective encoding never reaches the scorer"
type = "forbidden"
source_modules = ["roster_replan.disruption"]
forbidden_modules = ["roster_replan.scoring", "roster_replan.checker", "roster_replan.model"]

# Two claims at once, which is why this contract outlived the study that created it. As a
# benchmark baseline, greedy repair must not be the solver in disguise -- a baseline that
# consults the thing it measures measures nothing. As the third rung of T3's fallback
# ladder, it must not need the solver *at all*, because the rung exists for the case where
# the solver did not deliver.
[[tool.importlinter.contracts]]
name = "The greedy baseline is solver-free"
type = "forbidden"
source_modules = ["roster_replan.repair"]
forbidden_modules = [
    "roster_replan.model",
    "roster_replan.disruption",
    "roster_replan.scoring",
    "ortools",
]

# The solver has to stay runnable, testable and replayable with no web layer present.
# `service.md` puts it the other way round -- the boundary is deliberately boring and the
# intricate part is small -- and this is the direction that keeps it true: the intricate
# part must never learn about HTTP.
[[tool.importlinter.contracts]]
name = "The solver core never reaches the service layer"
type = "forbidden"
source_modules = [
    "roster_replan.model",
    "roster_replan.checker",
    "roster_replan.domain",
    "roster_replan.disruption",
    "roster_replan.scoring",
    "roster_replan.validation",
    "roster_replan.repair",
    "roster_replan.ladder",
]
forbidden_modules = ["roster_replan.service", "fastapi", "pydantic", "starlette"]

[[tool.importlinter.contracts]]
name = "The shared schema depends on nothing"
type = "forbidden"
source_modules = ["roster_replan.domain"]
forbidden_modules = [
    "roster_replan.checker",
    "roster_replan.model",
    "roster_replan.validation",
    "roster_replan.scoring",
    "roster_replan.disruption",
    "ortools",
]
