[project]
name = "roster-replan-optimizer"
version = "0.0.0"
description = "Minimum-disruption shift-roster replanning under labour constraints."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "ortools>=9.14",
    "uvicorn>=0.52.3",
]

[project.optional-dependencies]
nl = [
    "anthropic>=0.122.0",
]

[dependency-groups]
dev = [
    "anyio>=4.14.2",
    "httpx>=0.28.1",
    "import-linter>=2.13",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo root as well as `tests`. There is no `[build-system]` -- this is a service, not
# a distributable package -- so `roster_replan` and `benchmarks` are found on the path
# rather than installed. Without the root, `uv run pytest` fails at conftest import while
# `uv run python -m pytest` succeeds, and the difference is invisible to anyone who has not
# hit it.
pythonpath = [".", "tests"]
# `machine` marks a test that asserts a committed artifact against the machine that
# recorded it. There are two, and they are calibrated to different things: `timings.json`
# to the hardware (`D-114`), and the solved half of `manifest.json` to the ortools build,
# because the optimum is degenerate and which roster comes back is a property of the search
# path (`D-117`). CI deselects both with `-m "not machine"`; everywhere else they run by
# default, because on the machine the artifacts came from they are exactly the guards
# `D-096` and `D-074` ask for.
markers = [
    "machine: asserts an artifact recorded on this machine's hardware or solver build",
]

# The independence rule from docs/specs/rules.md, mechanised. The module boundary is
# enforceable; the no-shared-thresholds half is a review obligation no linter can
# discharge, since none can tell a shared constant from a coincidentally equal one.
[tool.importlinter]
root_packages = ["roster_replan", "benchmarks"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The checker is an independent reading: it never reaches the model or a solver"
type = "forbidden"
source_modules = ["roster_replan.checker"]
forbidden_modules = ["roster_replan.model", "ortools"]

[[tool.importlinter.contracts]]
name = "The model never reaches the checker"
type = "forbidden"
source_modules = ["roster_replan.model"]
forbidden_modules = ["roster_replan.checker"]

[[tool.importlinter.contracts]]
name = "Input validation is independent of both readings"
type = "forbidden"
source_modules = ["roster_replan.validation"]
forbidden_modules = [
    "roster_replan.checker",
    "roster_replan.model",
    "roster_replan.disruption",
    "ortools",
]

# The same independence, applied to the objective. Brute-force stage (b) compares the
# optimum `disruption` encodes against the minimum `scoring` measures, so a shared helper
# would turn that comparison into an identity.
[[tool.importlinter.contracts]]
name = "The objective scorer is an independent reading: no solver, no model encoding"
type = "forbidden"
source_modules = ["roster_replan.scoring"]
forbidden_modules = [
    "roster_replan.disruption",
    "roster_replan.model",
    "roster_replan.checker",
    "ortools",
]

[[tool.importlinter.contracts]]
name = "The objective encoding never reaches the scorer"
type = "forbidden"
source_modules = ["roster_replan.disruption"]
forbidden_modules = ["roster_replan.scoring", "roster_replan.checker", "roster_replan.model"]

# Two claims at once, which is why this contract outlived the study that created it. As a
# benchmark baseline, greedy repair must not be the solver in disguise -- a baseline that
# consults the thing it measures measures nothing. As the third rung of T3's fallback
# ladder, it must not need the solver *at all*, because the rung exists for the case where
# the solver did not deliver.
[[tool.importlinter.contracts]]
name = "The greedy baseline is solver-free"
type = "forbidden"
source_modules = ["roster_replan.repair"]
forbidden_modules = [
    "roster_replan.model",
    "roster_replan.disruption",
    "roster_replan.scoring",
    "ortools",
]

# The solver has to stay runnable, testable and replayable with no web layer present.
# `service.md` puts it the other way round -- the boundary is deliberately boring and the
# intricate part is small -- and this is the direction that keeps it true: the intricate
# part must never learn about HTTP.
# An explanation derived from the model's own presolve table is the solver's account of
# itself: a wrong exclusion would produce a wrong explanation that agrees with it. Asking
# the independent reading instead means a wrong exclusion contradicts the roster, which is
# a finding rather than a consistent lie.
[[tool.importlinter.contracts]]
name = "The explainer answers from the checker, never from the model"
type = "forbidden"
source_modules = ["roster_replan.explain", "roster_replan.prose"]
forbidden_modules = [
    "roster_replan.model",
    "roster_replan.disruption",
    "ortools",
]

[[tool.importlinter.contracts]]
name = "The solver core never reaches the service layer"
type = "forbidden"
source_modules = [
    "roster_replan.model",
    "roster_replan.checker",
    "roster_replan.domain",
    "roster_replan.disruption",
    "roster_replan.scoring",
    "roster_replan.validation",
    "roster_replan.repair",
    "roster_replan.ladder",
    "roster_replan.explain",
    "roster_replan.prose",
]
forbidden_modules = ["roster_replan.service", "fastapi", "pydantic", "starlette"]

# `config.md`: deterministic profile editing works fully with no LLM; the NL layer is an
# accelerator, never a dependency. That sentence is a claim about the import graph, so it is
# checked as one -- and it covers the SDK as well as the module, because a deterministic
# layer that imports `anthropic` needs the optional extra installed to run at all.
[[tool.importlinter.contracts]]
name = "The natural-language layer is an accelerator: nothing deterministic reaches it"
type = "forbidden"
source_modules = [
    "roster_replan.domain",
    "roster_replan.validation",
    "roster_replan.checker",
    "roster_replan.model",
    "roster_replan.disruption",
    "roster_replan.scoring",
    "roster_replan.repair",
    "roster_replan.ladder",
    "roster_replan.explain",
    "roster_replan.prose",
    "roster_replan.core",
    "roster_replan.whatif",
    "roster_replan.profile",
    "roster_replan.service",
]
forbidden_modules = ["roster_replan.nl", "anthropic"]

# The same claim the greedy contract makes, for the same reason, about a different rival.
# A penalty-based search exists here to be compared against the exact model, and a rival
# that can reach the model is not a rival. It is also the module whose whole point is that
# it has no hard-constraint guarantee, so it must not be able to borrow one.
[[tool.importlinter.contracts]]
name = "The penalty search is solver-free"
type = "forbidden"
source_modules = ["benchmarks.anneal"]
forbidden_modules = [
    "roster_replan.model",
    "roster_replan.disruption",
    "ortools",
]

[[tool.importlinter.contracts]]
name = "The shared schema depends on nothing"
type = "forbidden"
source_modules = ["roster_replan.domain"]
forbidden_modules = [
    "roster_replan.checker",
    "roster_replan.model",
    "roster_replan.validation",
    "roster_replan.scoring",
    "roster_replan.disruption",
    "ortools",
]
