# The load-bearing figures, and the document that owns each one.
#
# A number measured in one place gets copied into others and then drifts when the source
# is corrected. That has happened three times here, every time found by hand: the scale
# table's three rows (`D-155`), the illegal-past figure's four copies, and the record,
# ledger and parity counts found alongside them (`D-157`). `scripts/lint_docs.py` reads
# this file and fails when a copy disagrees with its owner.
#
# `kind` is where the value comes from, and it is the whole distinction:
#
#   derived  the repository can recount it from itself, so `compute` names the function
#            and every stated value must match what it returns. These are invariant
#            claims: "every ledger row names its spec, 16 of 16" says something that is
#            supposed to still be true, so recounting it is right.
#
#   pinned   nothing here can recount it: a solver status on data that is fetched rather
#            than committed, a wall-clock second on one machine on one day. The value is
#            whatever the owner's `<!-- fig:<id> -->` line says, and the check is only
#            that every other statement of it agrees. Nothing is ever re-measured.
#
# `context`, where a figure has one, is matched on both sides of the number and is what
# tells one figure from another when the numbers alone cannot.
#
# `reproducible` records the second half of that distinction and nothing acts on it:
# `computed` (the linter recounts it), `command` (a deterministic re-run would settle it,
# and `command` says which), `no` (nothing would; the number is a property of a machine).
#
# A line carrying `<!-- lint-ok -->` is skipped, which is how a document states a
# superseded figure on purpose. The annotation is the declaration that it is historical.

[[figure]]
id = "decision-records"
owner = "docs/decisions.md"
kind = "derived"
compute = "decision_records"
reproducible = "computed"
pattern = '(?i)\b(\d+)\*{0,2}\s+curated\s+records\b'
note = "Claimed by `docs/README.md` and `CLAUDE.md`, which disagreed by six."

[[figure]]
id = "ledger-rows"
owner = "docs/specs/README.md"
kind = "derived"
compute = "ledger_rows"
reproducible = "computed"
pattern = '(?i)Every ledger row [^\n]{0,90}?\*{0,2}(\d+) of \d+'
note = """A coverage claim, not an event: it says every row names a spec. Adding a row \
without a spec is what makes it false, which is `D-157`'s ledger incident."""

[[figure]]
id = "record-inbound-links"
owner = "CLAUDE.md"
kind = "derived"
compute = "record_inbound_links"
tolerance = 0.05
reproducible = "computed"
pattern = '\*{0,2}(\d+)\s+links\s+from\s+the\s+documentation\s+into\s+the\s+records'
note = """`CLAUDE.md` calls these re-measurable rather than folklore, which is only true \
if something re-measures them. Banded at 5%: the argument is about magnitude."""

[[figure]]
id = "record-internal-links"
owner = "CLAUDE.md"
kind = "derived"
compute = "record_internal_links"
tolerance = 0.05
reproducible = "computed"
pattern = '\*{0,2}(\d+)\s+more\s+inside\s+`decisions\.md`\s+itself'
note = "As above."

[[figure]]
id = "record-code-citations"
owner = "CLAUDE.md"
kind = "derived"
compute = "record_code_citations"
tolerance = 0.05
reproducible = "computed"
pattern = '\*{0,2}(\d+)\s+backticked\s+citations\s+in\s+code\s+and\s+tests'
note = "As above."

[[figure]]
id = "foreign-illegal-past"
owner = "docs/studies/foreign-incumbent.md"
kind = "pinned"
reproducible = "command"
command = "uv run python -m benchmarks.foreign --fetch && uv run python -m benchmarks.foreign --study"
pattern = '(?i)\b(\d+|[a-z]+)\s+of\s+(?:the\s+)?(?:13|thirteen)\b'
context = '(?i)illegal|published roster'
note = """`D-155` corrected it from 10 to 8 and four copies kept the old number for a \
session. The count is deterministic given the fetched instances, so `command` would \
settle it; the data is not committed (their site states no licence) so CI cannot."""

[[figure]]
id = "foreign-instance-8-search-seconds"
owner = "docs/studies/foreign-incumbent.md"
kind = "pinned"
reproducible = "no"
command = "uv run python -m benchmarks.foreign --fetch && uv run python -m benchmarks.foreign --study"
pattern = '(\d+\.\d+)\s*(?:s\b|seconds)[^.]{0,45}?to prove optimality'
note = """The first genuinely hard search this project saw, stated in six documents. It is \
`no` rather than `command`: the command re-runs the instance, but a wall-clock second is a \
property of the machine, so nothing can assert the recorded 7.71. Only the copies are checked.

`penalty-search.md` states a different measurement in nearly the same words (5.74 s on this \
project's own set) and carries a `lint-ok` saying so. That is the cost of a figure whose \
prose no pattern can tell apart from another's."""

[[figure]]
id = "mutant-count"
owner = "docs/STATE.md"
kind = "derived"
compute = "mutant_count"
reproducible = "computed"
pattern = 'Mutants, each naming the layer that must catch it \| \d+ \| \*{0,2}(\d+)'
note = """The size of the catalogue today, which the repo table claims as *Now*. Adding a \
layer means adding a mutant, so this moves whenever `tests/mutation.py` does, and it was \
two behind within a day of `D-157` correcting seven other figures for the same reason.

The pattern is deliberately narrow, matching only the table's second column. Every other \
mutant number in this repository (`136 of 136`, `132 of 132`, `103 before`) is a record of \
one run, which is a durable measurement rather than a statement of the current count."""

# There is no entry for *how many mutants have not been in a full run*, and the reason is
# worth keeping. It was written and then removed: the only record of which mutants a full
# run covered is `tests/mutation-report.json`, which is gitignored as "the verdict, not an
# input", so the check passed on the machine holding a report and would have failed in CI,
# where the file does not exist. A documentation check whose answer depends on a local run
# artifact is the defect `D-118` and `D-121` already record: a verdict that is a property of
# the machine that produced it. The count stays reviewed prose in `STATE.md`, beside a table
# naming each of the four.

[[figure]]
id = "headline-changes-cold"
owner = "docs/benchmarks.md"
kind = "pinned"
reproducible = "command"
command = "uv run python -m benchmarks.run --write"
pattern = '\|\s*307\.3\s*\|\s*(\d+\.\d+)\s*\|'
note = """The number the front page leads with, and the one a reader remembers, so \
it is the copy most worth checking. Anchored on the disruption column of the same row, so a \
reworded table matches nothing and is reported rather than passing quietly. `pinned` because \
`results.json` is not committed (`D-084`), so nothing here can recount a mean over 2,520 \
runs."""

[[figure]]
id = "headline-changes-replan"
owner = "docs/benchmarks.md"
kind = "pinned"
reproducible = "command"
command = "uv run python -m benchmarks.run --write"
pattern = '\|\s*65\.3\s*\|\s*(\d+\.\d+)\s*\|'
note = """The other half of the headline. Its pattern matches two rows per document, the \
cold disruption solve and the warm replan, which score the same and must keep saying so: \
`D-082`'s point is that the objective does the work and the warm start does not. The \
prose form *12.4 to 2.4* is a rounding of both and is left to review; a check cannot tell \
a rounding from a stale copy."""

[[figure]]
id = "headline-fully-staffed-weeks"
owner = "docs/benchmarks.md"
kind = "pinned"
reproducible = "computed"
command = "uv run python -m benchmarks.run --write"
pattern = '(?i)fully staffed before the (?:event|disruption)\**:?\s*\**(\d+)'
note = """The segment the two headline means are taken over, and it belongs beside them \
wherever they are quoted: a mean is not a number without the set it is a mean of. The pattern is anchored \
on the sentence rather than on the digits, because 72 is also a case count in three other \
claims in the same file. `pinned` for the reason its two companions are: the segmentation is \
`results.json`'s and that file is not committed (`D-084`)."""
